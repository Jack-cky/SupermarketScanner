[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smktscnr"
version = "1.0.6"
description = "SupermarketScanner demo and kiosk modules"
license = { text = "MIT" }
authors = [{ name = "Jack Chan" }]
requires-python = "~=3.12.0"
dependencies = [
    "numpy==1.26.4",
    "onnxruntime==1.19.2",
    "opencv-python==4.11.0.86",
    "Pillow==11.0",
    "PyYAML==6.0.2",
    "supervision==0.25.1",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
demo = [
    "huggingface-hub==1.18.0",
    "streamlit-image-select==0.6.0",
    "streamlit==1.43.2",
]
headless = [
    "opencv-python-headless==4.11.0.86",
]

[tool.setuptools.packages.find]
include = ["smktscnr*"]
